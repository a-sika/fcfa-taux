name: Mise à jour quotidienne

on:
  schedule:
    - cron: "30 6 * * *"   # tous les jours à 06h30 UTC
  workflow_dispatch:        # lancement manuel possible (bouton "Run workflow")
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construire le site (récupère les taux du jour)
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: node build.mjs

      - name: Sauvegarder l'historique des taux
        run: |
          git config user.name "taux-bot"
          git config user.email "taux-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Taux du jour" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
